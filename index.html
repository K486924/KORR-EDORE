<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080a0b">
  <title>KORR EDORE</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main id="game-root" aria-label="KORR EDORE game">
    <canvas id="game-canvas" aria-label="3D game view"></canvas>
    <section id="boot-panel">
      <p class="eyebrow">PROCEDURAL HORROR PROJECT</p>
      <h1>KORR EDORE</h1>
      <p id="boot-status">Building the first place…</p>
    </section>
    <nav id="touch-pad" aria-label="Movement controls">
      <button data-move="forward" aria-label="Move forward">↑</button>
      <button data-move="left" aria-label="Move left">←</button>
      <button data-move="back" aria-label="Move backward">↓</button>
      <button data-move="right" aria-label="Move right">→</button>
    </nav>
    <button id="flashlight-toggle" type="button" aria-label="Toggle flashlight" aria-pressed="true">LIGHT ON</button>
    <div id="look-hint">DRAG TO LOOK</div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
