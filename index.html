<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080a0b">
  <title>KORR EDORE</title>
  <link rel="stylesheet" href="./src/styles.css?v=8">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <main id="game-root" aria-label="KORR EDORE game">
    <canvas id="game-canvas" aria-label="3D game view"></canvas>
    <div id="crosshair" aria-hidden="true"><i></i></div>
    <section id="boot-panel">
      <p class="eyebrow">A COUNTRYSIDE GETAWAY</p>
      <h1>KORR EDORE</h1>
      <p id="boot-status">Arriving at the farmhouse…</p>
    </section>
    <nav id="touch-pad" aria-label="Movement controls">
      <button data-move="forward" aria-label="Move forward">↑</button>
      <button data-move="left" aria-label="Move left">←</button>
      <button data-move="back" aria-label="Move backward">↓</button>
      <button data-move="right" aria-label="Move right">→</button>
    </nav>
    <section id="player-status" aria-label="Player status">
      <div class="status-row"><span>HEALTH</span><strong id="health-value">100%</strong></div>
      <div class="status-track health-track"><i id="health-fill"></i></div>
      <div class="status-row stamina-row"><span>STAMINA</span><strong id="stamina-value">100%</strong></div>
      <div class="status-track stamina-track"><i id="stamina-fill"></i></div>
    </section>
    <button id="sprint-button" type="button" aria-label="Hold to sprint" aria-pressed="false">SPRINT</button>
    <section id="vehicle-hud" hidden><strong>SEDAN</strong><span id="vehicle-speed">0 km/h</span><span id="spare-count">SPARES · 1</span></section>
    <button id="interact-button" type="button" hidden>OPEN GATE · E</button>
    <button id="flashlight-toggle" type="button" aria-label="Toggle flashlight" aria-pressed="false">LIGHT OFF</button>
    <div id="look-hint">DRAG TO LOOK</div>
  </main>
  <script type="module" src="./src/main.js?bootdiag=8"></script>
</body>
</html>
